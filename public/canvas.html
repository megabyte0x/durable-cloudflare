<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Canvas</title>
    <link rel="icon" href="favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0e10; }
      .shell { display: flex; height: 100dvh; }
      #stage { flex: 1; min-width: 0; height: 100%; border: 0; display: block; }
      #dock { width: 420px; height: 100%; border: 0; border-left: 1px solid #2a2a2e; display: block; background: #fff; }
      @media (max-width: 760px) {
        .shell { flex-direction: column; }
        #stage { height: 50dvh; flex: none; }
        #dock { width: 100%; height: 50dvh; border-left: 0; border-top: 1px solid #2a2a2e; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <iframe id="stage" src="stage" title="Canvas"></iframe>
      <iframe id="dock" src="dock" title="Chat"></iframe>
    </div>
  </body>
</html>
