[package]
name = "durable-cloudflare-board"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "lib.rs"
test = false
doctest = false
bench = false

[dependencies]
nanocode-board = { path = "../../repos/nanocodexyz/nanocode/crates/runtime/board" }
nanocode-durability-core = { path = "../../repos/nanocodexyz/nanocode/crates/core/durability" }
nanocode-turnlog = { path = "../../repos/nanocodexyz/nanocode/crates/core/turnlog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
serde_derive = { path = "../../repos/nanocodexyz/nanocode/crates/core/serde-derive" }
serde = { path = "../../repos/nanocodexyz/nanocode/crates/patches/serde" }
serde_core = { path = "../../repos/nanocodexyz/nanocode/crates/patches/serde_core" }
serde_json = { path = "../../repos/nanocodexyz/nanocode/crates/patches/serde_json" }
itoa = { path = "../../repos/nanocodexyz/nanocode/crates/core/itoa" }
memchr = { path = "../../repos/nanocodexyz/nanocode/crates/core/memchr" }
